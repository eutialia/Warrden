# Only Docker on Linux needs this file. The Docker daemon runs as root and cannot read a
# GVFS mount, which belongs to your user session, so Docker mounts the SMB shares itself
# and needs SMB_USERNAME and SMB_PASSWORD in .env.
#
# To drop the credentials, mount the shares system-wide with /etc/fstab or a systemd
# .mount unit, then bind-mount the resulting host path here instead.
#
# Running Warrden directly, or in an LXC where the shares are already in the filesystem,
# needs neither this file nor .env. Set the four paths under Settings, Storage.
#
# Copy this file to compose.override.yaml (git-ignored) and point the host paths at
# this machine's NAS mounts. The container paths are fixed: Warrden always expects
# exactly these four (see README, "Quickstart").
#
#   /tv        Sonarr Series root folder
#   /anime     Sonarr Anime root folder
#   /movies    Radarr library root
#   /downloads Torrent client download / completed root
#
# Leave a line out if this machine genuinely lacks that mount; the Storage health
# panel will report it as missing.
services:
  warrden:
    volumes:
      - /mnt/nas/Series:/tv
      - /mnt/nas/Anime:/anime
      - /mnt/nas/Movies:/movies
      - /mnt/nas/Downloads:/downloads

# Variant: no host mounts (e.g. the NAS is only reachable over SMB, or your file
# manager's GVFS mounts are invisible to the docker daemon). Let docker mount the
# shares itself as CIFS volumes; credentials go in .env (copy .env.example).
# Replace the bind mounts above with named volumes and define them like this:
#
# x-cifs-o: &cifs-o "addr=nas.lan,username=${SMB_USERNAME:?set in .env},password=${SMB_PASSWORD:?set in .env},uid=1000,gid=1000"
#
# services:
#   warrden:
#     volumes:
#       - tv:/tv
#       - anime:/anime
#       - movies:/movies
#       - downloads:/downloads
